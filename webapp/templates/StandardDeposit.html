<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Standard Deposit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
       <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
        }
        .keypad-button {
            width: 100%;
            height: 60px;
            font-size: 1.5rem;
	    margin-top: 5px;
        }
        .action-button {
            height: 60px;
            font-size: 1.5rem;
            color: white;
            border: none;
            width: 120%;
            line-height: 10px;
        }
        .cancel-btn { background-color: #dc3545; }
        .proceed-btn { background-color: #28a745; }
        .correction-btn { background-color: #ffc107;}
        .display {
        font-size: 80px;
        height: 100px;
        text-align: center;
        line-height: 120px;
        background-color: #f8f9fa;
        border: 2px solid #ced4da;
        border-radius: 10px;
        letter-spacing: 8px;
        padding: 0;
        }
        .modal-dialog {
        margin-top: 250px;
        }

    </style>
</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<body>
    <form method="post">
    <div class="container py-5">
        <h2 class="text-center mb-8">Enter Verified Cell Phone Number</h2>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <!-- Display Field -->
                <input type="text" id="display" class="form-control display mb-3" readonly>

                <!-- Keypad Grid -->
                <div class="row g-2">
                    <div class="col-3">
                        <button type="button" class="btn btn-secondary keypad-button" onclick="appendDigit('1')">1</button>
                        <button type="button" class="btn btn-secondary keypad-button" onclick="appendDigit('4')">4</button>
                        <button type="button" class="btn btn-secondary keypad-button" onclick="appendDigit('7')">7</button>
                        <button type="button" class="btn btn-secondary keypad-button" onclick="appendDigit('0')">0</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-secondary keypad-button" onclick="appendDigit('2')">2</button>
                        <button type="button" class="btn btn-secondary keypad-button" onclick="appendDigit('5')">5</button>
                        <button type="button" class="btn btn-secondary keypad-button" onclick="appendDigit('8')">8</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-secondary keypad-button" onclick="appendDigit('3')">3</button>
                        <button type="button" class="btn btn-secondary keypad-button" onclick="appendDigit('6')">6</button>
                        <button type="button" class="btn btn-secondary keypad-button" onclick="appendDigit('9')">9</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="action-button cancel-btn mb-2" onclick="cancelAction()">Cancel</button>
                        <button type="button" class="action-button correction-btn" onclick="clearDisplay()">Correction</button>
                        <button type="button" class="action-button proceed-btn mb-2" onclick="proceedAction()">Proceed</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

    <!-- Modal -->
    <div class="modal fade" id="alertModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Notice</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="alertMessage"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Confirm recipient -->
    <div class="modal fade" id="recipientModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 clcass="modal-title">Confirm recipient </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="recipientMessage"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal"
                    id = enterAmount onclick="Amount('Please enter amount to deposit to ')">OK</button>
                    <button type="button" id = btnCancel class="btn btn-primary"
                        data-bs-dismiss="modal" onclick="CancelDeposit()">Cancel</button>
                </div>
            </div>
        </div>
    </div>
     <!-- Enter Amount -->
    <div class="modal fade" id="AmountModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Enter Amount </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="AmountMessage">
                </div>
                <p> <input type="text" class="form-control display mb-3" id = "depositAmnt">
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal"
                    id = enterAmount onclick="checkString()">OK</button>
                    <button type="button" id = btnCancel class="btn btn-primary"
                        data-bs-dismiss="modal" onclick="CancelDeposit()">Cancel</button>
                </div>
            </div>
        </div>
    </div>

      <!-- Enter Reference -->
    <div class="modal fade" id="ReferenceModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Reference </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="ReferenceMessage">
                </div>
                 <p> <input type="text" class="form-control display mb-3" id = "ReferenceM">
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal"
                    id = enterAmount onclick="confirmDetails()">OK</button>
                    <button type="button" id = btnCancel class="btn btn-primary"
                        data-bs-dismiss="modal" onclick="CancelDeposit()">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirm Deposit details -->
    <div class="modal fade" id="DepositModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Reference </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="DepositMessage">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal"
                    id = enterAmount onclick = "deposit()" >OK</button>
                    <button type="button" id = btnCancel class="btn btn-primary"
                        data-bs-dismiss="modal" onclick="CancelDeposit()">Cancel</button>
                </div>
            </div>
        </div>
    </div>
    <script>

        nameReceiptant = "";

        let enteredValue = "";
        let amountDeposit ="";
        let referenceDeposit ="";

        const alertMessage = document.getElementById('alertMessage');
        const alertModal = new bootstrap.Modal(document.getElementById('alertModal'));

        // Recipient modals
        const recipientMessagee = document.getElementById('recipientMessage');
        const recipientModall = new bootstrap.Modal(document.getElementById('recipientModal'));

        //Enter Amount
        const AmountMessagee = document.getElementById('AmountMessage');
        const AmountModall = new bootstrap.Modal(document.getElementById('AmountModal'));
        const DepositAmount = document.getElementById('depositAmnt');

         //Enter Reference
        const ReferenceMessage = document.getElementById('ReferenceMessage');
        const ReferenceModal = new bootstrap.Modal(document.getElementById('ReferenceModal'));
        const Reference = document.getElementById('ReferenceM');

        //Confirm Deposit
        const DepositMessage = document.getElementById('DepositMessage');
        const DepositModal = new bootstrap.Modal(document.getElementById('DepositModal'));

        function checkString(){

            amountDeposit = document.getElementById("depositAmnt").value;
            if(amountDeposit.trim()===""){
                Amount('Amount entered cannot be null, please enter amount you wish to deposit');
            } else {
                EnterReference('Please enter reference');
            }
        }
        function EnterReference(message) {
            amountDeposit = document.getElementById("depositAmnt").value;
            ReferenceMessage.textContent = message;
            ReferenceModal.show();
        }

        function confirmDetails(){
            referenceDeposit = document.getElementById("ReferenceM").value;

            if (referenceDeposit.trim() === "") {
                referenceDeposit = "Demo Deposit";
            }
            DepositMessage.textContent = "You're about to deposit to " + nameReceiptant
                + " an amount of R" + amountDeposit + " with the reference: " + referenceDeposit;
            DepositModal.show();
        }
        function Amount(message){
            AmountMessagee.textContent = message + nameReceiptant;
            AmountModall.show();
        }

        function Receipient(message) {
            recipientMessagee.textContent = message;
            recipientModall.show();
        }
        function showAlert(message) {
            alertMessage.textContent = message;
            alertModal.show();
        }
        function CancelDeposit () {
            showAlert("Display cancelled!");
            clearDisplay();
        }
        function clearDisplay() {
            enteredValue = "";
            document.getElementById("display").value = "";
        }

        function cancelAction() {
            showAlert("Cancelled. Bye bye");
            clearDisplay();
        }

        function appendDigit(digit) {
            if (enteredValue.length < 10) {
                enteredValue += digit;
                document.getElementById("display").value = ".".repeat(enteredValue.length);
            }
        }
        function proceedAction() {
            if (enteredValue[0] !== '0') {
                alertMessage.textContent = "Invalid Cell Phone number entered, must start with a 0";
                alertModal.show();
                clearDisplay();
                return;
            }

            if (enteredValue.length < 10) {
                alertMessage.textContent = "Cell phone must be 10 digits, please re-enter";
                alertModal.show();
                clearDisplay();
                return;
            }

            fetch("{% url 'check_number' %}", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": document.querySelector(
                "[name=csrfmiddlewaretoken]"
            ).value
        },
        body: "cellphone=" + encodeURIComponent(enteredValue)
    })
    .then(response => response.json())
    .then(data => {

        if (data.found) {

           Receipient("You're about to make a deposit to " + data.name + " " + data.surname)
           nameReceiptant = data.name + " " + data.surname;

        } else {
            showAlert("Cell phone entered is not found")
            clearDisplay()
        }
        }

    )
        }
        function deposit() {

    fetch("{% url 'add_journal' %}", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]").value
        },
        body: new URLSearchParams({
            CellPhone: enteredValue,
            Receiver: nameReceiptant,
            DepositOption: "STD",
            Amount: amountDeposit,
            Success : true,
            Summary: referenceDeposit
        })
    })
    .then(response => response.json())
    .then(data => {
        console.log(data);
        showAlert("Deposit successful!")
        setTimeout(function() {
            window.location.href = "{% url 'index' %}";
        }, 3000);
    })
    .catch(error => console.error(error));

}
    </script>
    </form>
</body>
</html>
